<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>105班 作業與考試紅綠燈打卡系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .tl-card {
      border: 1.5px solid #334155;
      border-radius: 1rem;
      transition: transform 0.12s ease, background-color 0.2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tl-card:active { transform: scale(0.96); }
    .status-0 { background-color: #FADBD8; color: #0f172a; } /* 未完成：粉紅底黑字 */
    .status-1 { background-color: #FFF200; color: #0f172a; } /* 已完成：鮮黃底黑字 */
    .status-2 { background-color: #A9D18E; color: #0f172a; } /* 已覆核：草綠底黑字 */
    .spinner {
      border: 3px solid #e2e8f0; border-top: 3px solid #2563eb;
      border-radius: 50%; width: 26px; height: 26px; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 9999; transition: opacity 0.25s ease;
    }

    /* 📱 ================= 手機端自動偵測最佳化 (螢幕寬度 <= 640px) ================= */
    @media (max-width: 640px) {
      /* 1. 調整手機端根字體與容器邊距 */
      body {
        font-size: 16px; /* 防止 iOS Safari 點擊輸入框時畫面縮放跳動 */
      }
      main {
        padding-left: 0.75rem !important;
        padding-right: 0.75rem !important;
      }

      /* 2. 紅綠燈卡片放大：增加高度、內距與邊框視覺效果 */
      .tl-card {
        min-height: 116px !important;
        padding: 0.85rem 0.5rem !important;
        border-width: 2px !important;
      }
      .tl-card .text-base {
        font-size: 1.15rem !important; /* 科目字級放大 */
      }
      .tl-card .text-sm {
        font-size: 0.95rem !important; /* 內容字級放大 */
        line-height: 1.35 !important;
      }
      .tl-card .text-\[10px\] {
        font-size: 0.8rem !important; /* 狀態標籤放大 */
      }

      /* 3. 日期選單、輸入框與主要按鈕觸控區域放大 */
      select, input[type="text"], input[type="password"], input[type="date"], textarea {
        font-size: 1rem !important;
        padding-top: 0.85rem !important;
        padding-bottom: 0.85rem !important;
      }
      button {
        min-height: 44px; /* 符合 Apple/Google 規範的最小舒適觸控高度 */
      }

      /* 4. 導師後台學生晶片標籤（Chips）排版加大 */
      #studentChipsContainer button {
        font-size: 0.85rem !important;
        padding: 0.6rem 0.8rem !important;
      }

      /* 5. 進度條增粗，視覺更明顯 */
      #stuProgressBar, #progressBar {
        height: 12px !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-16 font-sans">

  <script>
    // ⚙️ === 可供調整之系統參數 ===
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxTDEzg5YMmufWVry6KtKwnoi26mcAhuspavXgu5uhfinm6fISEwgQdpqwD2PKfWjlLEQ/exec";
    const TOKEN_STORAGE_KEY = "CLASS105_TODO_TOKEN_V2";

    let authToken = "";
    let studentState = { info: null, dates: [], currentDate: "", tasks: [] };
    let teacherState = { pendingStudents: [], allStudents: [], selectedSeat: null, assignType: "導師加派", selectedAssignSeats: new Set() };

    // --- 統一 POST API 呼叫器 (絕不使用 GET 傳送敏感資訊) ---
    async function callApi(payload) {
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data && data.authExpired) {
        logout();
        showLoginError("登入憑證已過期，請重新輸入密碼登入。");
      }
      return data;
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.remove("hidden");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.add("hidden"), 2500);
    }

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function formatDateTW(dStr) {
      if (!dStr || dStr.length !== 8) return dStr;
      const y = dStr.slice(0, 4), m = dStr.slice(4, 6), d = dStr.slice(6, 8);
      const w = ['日', '一', '二', '三', '四', '五', '六'][new Date(`${y}-${m}-${d}`).getDay()];
      return `${y}/${m}/${d} (${w})`;
    }

    function toInputDateStr(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, "0");
      const d = String(dateObj.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function formatCardLines(title) {
      const idx = title.search(/[:：]/);
      if (idx > 0 && idx < 6) {
        const sub = escapeHtml(title.slice(0, idx).trim());
        const content = escapeHtml(title.slice(idx + 1).trim());
        return `<div class="text-base font-extrabold leading-tight">${sub}<span class="text-slate-500 text-xs ml-0.5">↓</span></div>
                <div class="text-sm font-bold leading-snug mt-1 break-words">${content}<span class="text-slate-500 text-xs ml-0.5">↵</span></div>`;
      }
      return `<div class="text-sm font-extrabold leading-snug break-words">${escapeHtml(title)}<span class="text-slate-500 text-xs ml-0.5">↵</span></div>`;
    }

    function switchView(viewId) {
      ["viewLogin", "viewStudent", "viewTeacher"].forEach(id => {
        document.getElementById(id).classList.toggle("hidden", id !== viewId);
      });
    }

    function showLoginError(msg) {
      const el = document.getElementById("loginError");
      el.textContent = msg;
      el.classList.remove("hidden");
    }

    // --- 🔐 登入與加密憑證 (Token) 處理 ---
    async function handleLoginSubmit(e) {
      e.preventDefault();
      if (GAS_API_URL.startsWith("請貼上")) {
        showLoginError("請先在 index.html 中設定正確的 GAS_API_URL！");
        return;
      }

      const account = document.getElementById("loginAccount").value.trim();
      const pwd = document.getElementById("loginPwd").value.trim();
      const remember = document.getElementById("rememberMe").checked;

      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.textContent = "安全驗證中...";
      document.getElementById("loginError").classList.add("hidden");

      try {
        const data = await callApi({ action: "login", account, pwd });
        if (!data.success) {
          showLoginError(data.message || "登入失敗");
          return;
        }

        document.getElementById("loginPwd").value = "";
        authToken = data.token;

        if (remember) {
          localStorage.setItem(TOKEN_STORAGE_KEY, authToken);
        } else {
          localStorage.removeItem(TOKEN_STORAGE_KEY);
        }

        enterAppByResponse(data);
      } catch (err) {
        showLoginError("連線失敗，請確認網路或 GAS 部署權限。");
      } finally {
        btn.disabled = false;
        btn.textContent = "登入系統";
      }
    }

    function enterAppByResponse(data) {
      if (data.role === "student") {
        studentState.info = data.student;
        studentState.dates = data.dates || [];
        studentState.currentDate = data.currentDate || "";
        studentState.tasks = data.tasks || [];
        renderStudentView();
        switchView("viewStudent");
      } else if (data.role === "teacher") {
        teacherState.pendingStudents = data.pendingStudents || [];
        teacherState.allStudents = data.allStudents || [];
        initTeacherAssignUI();
        renderTeacherPendingView();
        switchView("viewTeacher");
      }
    }

    function logout() {
      localStorage.removeItem(TOKEN_STORAGE_KEY);
      authToken = "";
      document.getElementById("loginPwd").value = "";
      switchView("viewLogin");
    }

    // --- 🎒 學生／家長打卡邏輯 ---
    function renderStudentView() {
      const s = studentState.info;
      document.getElementById("stuTitle").textContent = `🎒 ${s.seat}號 ${s.name}`;
      const sel = document.getElementById("stuDateSelect");
      if (studentState.dates.length > 0) {
        sel.innerHTML = studentState.dates.map(d =>
          `<option value="${d}" ${d === studentState.currentDate ? "selected" : ""}>${formatDateTW(d)}</option>`
        ).join("");
      } else {
        sel.innerHTML = `<option value="">尚無聯絡簿資料</option>`;
      }
      renderStudentCards();
    }

    async function loadStudentDate() {
      const dateVal = document.getElementById("stuDateSelect").value;
      if (!dateVal) return;
      document.getElementById("stuLoading").classList.remove("hidden");
      document.getElementById("stuSections").classList.add("opacity-40");

      try {
        const data = await callApi({ action: "getStudentData", token: authToken, date: dateVal });
        if (data.success) {
          studentState.currentDate = data.currentDate;
          studentState.tasks = data.tasks || [];
          renderStudentCards();
        }
      } catch (e) {
        showToast("讀取日期資料失敗");
      } finally {
        document.getElementById("stuLoading").classList.add("hidden");
        document.getElementById("stuSections").classList.remove("opacity-40");
      }
    }

    function renderStudentCards() {
      const exams = studentState.tasks.filter(t => t.type === "考試");
      const hws = studentState.tasks.filter(t => t.type === "作業");
      const extras = studentState.tasks.filter(t => t.type !== "考試" && t.type !== "作業");

      document.getElementById("cntExam").textContent = `${exams.length} 項`;
      document.getElementById("cntHw").textContent = `${hws.length} 項`;
      document.getElementById("cntExtra").textContent = `${extras.length} 項`;
      document.getElementById("secExtra").classList.toggle("hidden", extras.length === 0);

      renderStudentGrid("gridExam", exams);
      renderStudentGrid("gridHw", hws);
      renderStudentGrid("gridExtra", extras);

      const total = studentState.tasks.length;
      const done = studentState.tasks.filter(t => t.status >= 1).length;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      document.getElementById("stuProgressText").textContent = `${done} / ${total} (${pct}%)`;
      document.getElementById("stuProgressBar").style.width = `${pct}%`;
    }

    function renderStudentGrid(containerId, list) {
      const el = document.getElementById(containerId);
      if (list.length === 0) {
        el.innerHTML = `<p class="col-span-2 text-xs text-slate-400 text-center py-3">本日無項目</p>`;
        return;
      }
      el.innerHTML = list.map(t => {
        const idx = studentState.tasks.indexOf(t);
        const label = t.status === 2 ? "✅ 已覆核" : (t.status === 1 ? "已完成" : "未完成");
        return `
          <button onclick="onStudentCardClick(${idx})" class="tl-card status-${t.status} p-3.5 text-center flex flex-col items-center justify-center min-h-[96px] relative">
            ${formatCardLines(t.title)}
            <span class="mt-2 text-[10px] font-extrabold opacity-75">${label}</span>
          </button>
        `;
      }).join("");
    }

    async function onStudentCardClick(idx) {
      const task = studentState.tasks[idx];
      if (!task) return;
      if (task.status === 2) {
        showToast("🔒 導師已覆核完成，無法修改喔！");
        return;
      }

      const prev = task.status;
      task.status = prev === 0 ? 1 : 0;
      renderStudentCards();
      setBadge("stuSyncBadge", "☁️ 儲存中...", "blue");

      try {
        const data = await callApi({
          action: "studentCheck",
          token: authToken,
          date: task.date,
          type: task.type,
          title: task.title,
          status: task.status
        });
        if (!data.success) {
          task.status = data.locked ? 2 : prev;
          renderStudentCards();
          showToast(data.message || "儲存失敗");
          setBadge("stuSyncBadge", "已還原", "red");
          return;
        }
        setBadge("stuSyncBadge", "✅ 已同步", "green");
      } catch (e) {
        task.status = prev;
        renderStudentCards();
        setBadge("stuSyncBadge", "❌ 儲存失敗", "red");
        showToast("網路異常，請重試");
      }
    }

    // --- 👩‍🏫 導師管理後台邏輯 ---
    function switchTeacherTab(tab) {
      const isVerify = tab === "verify";
      document.getElementById("teacherTabVerify").classList.toggle("hidden", !isVerify);
      document.getElementById("teacherTabAssign").classList.toggle("hidden", isVerify);
      document.getElementById("tabBtnVerify").className = isVerify
        ? "py-2.5 rounded-xl text-sm font-extrabold bg-amber-400 text-slate-900 transition"
        : "py-2.5 rounded-xl text-sm font-extrabold text-white hover:bg-slate-800 transition";
      document.getElementById("tabBtnAssign").className = !isVerify
        ? "py-2.5 rounded-xl text-sm font-extrabold bg-amber-400 text-slate-900 transition"
        : "py-2.5 rounded-xl text-sm font-extrabold text-white hover:bg-slate-800 transition";
    }

    async function refreshTeacherPending() {
      setBadge("teaSyncBadge", "🔄 載入名單中...", "blue");
      try {
        const data = await callApi({ action: "getTeacherPending", token: authToken });
        if (data.success) {
          teacherState.pendingStudents = data.pendingStudents || [];
          teacherState.allStudents = data.allStudents || [];
          teacherState.selectedSeat = null;
          renderTeacherPendingView();
          setBadge("teaSyncBadge", "✅ 名單已更新", "green");
          showToast("已重新整理最新待覆核名單");
        }
      } catch (e) {
        setBadge("teaSyncBadge", "❌ 更新失敗", "red");
      }
    }

    function renderTeacherPendingView() {
      const list = teacherState.pendingStudents;
      document.getElementById("pendingStudentCount").textContent = list.length;

      const clearBanner = document.getElementById("allClearBanner");
      const stuPanel = document.getElementById("selectedStudentPanel");
      const chipsEl = document.getElementById("studentChipsContainer");

      if (list.length === 0) {
        chipsEl.innerHTML = `<p class="text-xs text-slate-400">目前無待覆核學生</p>`;
        clearBanner.classList.remove("hidden");
        stuPanel.classList.add("hidden");
        return;
      }

      clearBanner.classList.add("hidden");
      if (!teacherState.selectedSeat || !list.some(s => s.seat === teacherState.selectedSeat)) {
        teacherState.selectedSeat = list[0].seat;
      }

      chipsEl.innerHTML = list.map(s => {
        const active = s.seat === teacherState.selectedSeat;
        const cls = active
          ? "bg-slate-900 text-white border-slate-900 shadow"
          : "bg-slate-50 text-slate-700 border-slate-300 hover:bg-slate-100";
        return `
          <button onclick="selectTeacherStudent('${s.seat}')" class="px-3 py-2 rounded-xl border text-xs font-extrabold transition ${cls}">
            ${s.seat}號 ${escapeHtml(s.name)}
            <span class="ml-1 opacity-90">${s.yellowCount > 0 ? `🟡${s.yellowCount}` : ""} ${s.redCount > 0 ? `🔴${s.redCount}` : ""}</span>
          </button>
        `;
      }).join("");

      renderSelectedStudentDates();
    }

    function selectTeacherStudent(nextSeat) {
      if (teacherState.selectedSeat && teacherState.selectedSeat !== nextSeat) {
        pruneClearedItems(teacherState.selectedSeat);
      }
      teacherState.selectedSeat = nextSeat;
      renderTeacherPendingView();
    }

    function pruneClearedItems(seat) {
      const stuIdx = teacherState.pendingStudents.findIndex(s => s.seat === seat);
      if (stuIdx === -1) return;
      const stu = teacherState.pendingStudents[stuIdx];
      let y = 0, r = 0;
      stu.dateGroups = stu.dateGroups.map(g => ({
        date: g.date,
        items: g.items.filter(it => {
          if (it.status < 2) {
            if (it.status === 1) y++; else r++;
            return true;
          }
          return false;
        })
      })).filter(g => g.items.length > 0);

      stu.yellowCount = y;
      stu.redCount = r;
      if (stu.dateGroups.length === 0) {
        teacherState.pendingStudents.splice(stuIdx, 1);
      }
    }

    function renderSelectedStudentDates() {
      const stu = teacherState.pendingStudents.find(s => s.seat === teacherState.selectedSeat);
      const panel = document.getElementById("selectedStudentPanel");
      if (!stu) { panel.classList.add("hidden"); return; }

      panel.classList.remove("hidden");
      document.getElementById("selectedStuHeader").textContent = `${stu.seat}號 ${stu.name} 的未覆核項目`;

      const container = document.getElementById("studentDateGroups");
      container.innerHTML = stu.dateGroups.map((group, gIdx) => `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
          <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
            <span class="text-sm font-extrabold text-slate-800">📅 ${formatDateTW(group.date)}</span>
            <button onclick="batchVerifyDateGroup(${gIdx})" class="text-[11px] font-extrabold bg-emerald-100 hover:bg-emerald-200 text-emerald-800 px-2.5 py-1 rounded-lg">本日全轉綠燈</button>
          </div>
          <div class="grid grid-cols-2 gap-3">
            ${group.items.map((item, iIdx) => {
              const stLabel = item.status === 2 ? "✅ 已覆核" : (item.status === 1 ? "已完成" : "未完成");
              return `
                <button onclick="onTeacherCardClick(${gIdx}, ${iIdx})" class="tl-card status-${item.status} p-3.5 text-center flex flex-col items-center justify-center min-h-[100px] relative">
                  <span class="absolute top-1.5 left-2 text-[10px] font-extrabold opacity-60">${escapeHtml(item.type)}</span>
                  <div class="mt-2">${formatCardLines(item.title)}</div>
                  <span class="mt-2 text-[10px] font-extrabold opacity-75">${stLabel}</span>
                </button>
              `;
            }).join("")}
          </div>
        </div>
      `).join("");
    }

    async function onTeacherCardClick(gIdx, iIdx) {
      const stu = teacherState.pendingStudents.find(s => s.seat === teacherState.selectedSeat);
      if (!stu) return;
      const item = stu.dateGroups[gIdx].items[iIdx];
      const prev = item.status;
      item.status = prev === 2 ? 0 : 2;
      renderSelectedStudentDates();

      await sendTeacherBatch([{ date: item.date, seat: stu.seat, type: item.type, title: item.title, status: item.status }], () => {
        item.status = prev;
        renderSelectedStudentDates();
      });
    }

    async function batchVerifyDateGroup(gIdx) {
      const stu = teacherState.pendingStudents.find(s => s.seat === teacherState.selectedSeat);
      if (!stu) return;
      const group = stu.dateGroups[gIdx];
      const targets = group.items.filter(it => it.status < 2);
      if (targets.length === 0) return;

      const backup = targets.map(it => ({ it, prev: it.status }));
      targets.forEach(it => it.status = 2);
      renderSelectedStudentDates();

      await sendTeacherBatch(
        targets.map(it => ({ date: it.date, seat: stu.seat, type: it.type, title: it.title, status: 2 })),
        () => { backup.forEach(b => b.it.status = b.prev); renderSelectedStudentDates(); }
      );
    }

    async function batchVerifyStudent(mode) {
      const stu = teacherState.pendingStudents.find(s => s.seat === teacherState.selectedSeat);
      if (!stu) return;
      const targets = [];
      stu.dateGroups.forEach(g => {
        g.items.forEach(it => {
          if (mode === "yellowOnly" && it.status === 1) targets.push(it);
          else if (mode === "all" && it.status < 2) targets.push(it);
        });
      });
      if (targets.length === 0) {
        showToast(mode === "yellowOnly" ? "目前沒有黃燈(已完成)項目" : "皆已轉為綠燈");
        return;
      }

      const backup = targets.map(it => ({ it, prev: it.status }));
      targets.forEach(it => it.status = 2);
      renderSelectedStudentDates();

      await sendTeacherBatch(
        targets.map(it => ({ date: it.date, seat: stu.seat, type: it.type, title: it.title, status: 2 })),
        () => { backup.forEach(b => b.it.status = b.prev); renderSelectedStudentDates(); }
      );
    }

    async function sendTeacherBatch(items, onErrorRollback) {
      setBadge("teaSyncBadge", "☁️ 寫入覆核中...", "blue");
      try {
        const data = await callApi({ action: "teacherBatchVerify", token: authToken, items: items });
        if (!data.success) throw new Error(data.message);
        setBadge("teaSyncBadge", "✅ 覆核已儲存", "green");
      } catch (e) {
        if (onErrorRollback) onErrorRollback();
        setBadge("teaSyncBadge", "❌ 儲存失敗", "red");
        showToast("寫入失敗，已還原狀態");
      }
    }

    // --- 📢 導師分派任務 & 強制同步區間初始化 ---
    function initTeacherAssignUI() {
      setSyncPreset("thisWeek"); // 預設強制讀取簡報區間為本週一～週六
      document.getElementById("assignDate").value = toInputDateStr(new Date());

      const picker = document.getElementById("assignSeatPicker");
      picker.innerHTML = teacherState.allStudents.map(s => `
        <button type="button" id="assignChip_${s.seat}" onclick="toggleAssignSeat('${s.seat}')"
                class="px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white text-xs font-bold text-slate-700">
          ${s.seat} ${escapeHtml(s.name)}
        </button>
      `).join("");
    }

    function toggleTargetPicker() {
      const mode = document.querySelector('input[name="assignTargetMode"]:checked').value;
      document.getElementById("assignSeatPicker").classList.toggle("hidden", mode === "ALL");
    }

    function toggleAssignSeat(seat) {
      const btn = document.getElementById(`assignChip_${seat}`);
      if (teacherState.selectedAssignSeats.has(seat)) {
        teacherState.selectedAssignSeats.delete(seat);
        btn.className = "px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white text-xs font-bold text-slate-700";
      } else {
        teacherState.selectedAssignSeats.add(seat);
        btn.className = "px-2.5 py-1.5 rounded-lg border border-slate-900 bg-slate-900 text-xs font-bold text-white";
      }
    }

    function selectAssignType(type) {
      teacherState.assignType = type;
      ["考試", "作業", "導師加派"].forEach(t => {
        const el = document.getElementById(`typeBtn${t}`);
        el.className = (t === type)
          ? "assign-type-btn py-2.5 rounded-xl text-xs font-extrabold border border-slate-700 bg-amber-300 text-slate-900"
          : "assign-type-btn py-2.5 rounded-xl text-xs font-extrabold border border-slate-300 bg-white text-slate-700";
      });
    }

    async function submitAssignTasks() {
      const dateVal = document.getElementById("assignDate").value;
      const mode = document.querySelector('input[name="assignTargetMode"]:checked').value;
      const rawText = document.getElementById("assignRawText").value.trim();
      const targets = mode === "ALL" ? ["ALL"] : Array.from(teacherState.selectedAssignSeats);

      if (!dateVal || !rawText || targets.length === 0) {
        showToast("請確認日期、對象與內容皆已填寫！");
        return;
      }

      const btn = document.getElementById("assignSubmitBtn");
      btn.disabled = true;
      btn.textContent = "派發中...";

      try {
        const data = await callApi({
          action: "assignTasks",
          token: authToken,
          date: dateVal,
          targets: targets,
          type: teacherState.assignType,
          rawText: rawText
        });
        if (!data.success) throw new Error(data.message);

        document.getElementById("assignRawText").value = "";
        showToast(`✅ 分派成功！共新增 ${data.addedCount} 筆任務`);
        refreshTeacherPending();
      } catch (e) {
        showToast("❌ 分派失敗，請重試");
      } finally {
        btn.disabled = false;
        btn.textContent = "🚀 立即分派至系統";
      }
    }

    // --- 🔄 導師強制讀取簡報區間 ---
    function setSyncPreset(mode) {
      const now = new Date();
      const day = now.getDay(); // 0=日, 1=一 ... 6=六
      const diffToMon = (day === 0) ? -6 : (1 - day);

      const start = new Date(now);
      const end = new Date(now);

      if (mode === "thisWeek") {
        start.setDate(now.getDate() + diffToMon);
        end.setDate(start.getDate() + 5); // 週一 + 5天 = 週六
      } else if (mode === "lastWeek") {
        start.setDate(now.getDate() + diffToMon - 7);
        end.setDate(start.getDate() + 5);
      }

      const startEl = document.getElementById("syncStartDate");
      const endEl = document.getElementById("syncEndDate");
      if (startEl && endEl) {
        startEl.value = toInputDateStr(start);
        endEl.value = toInputDateStr(end);
      }
    }

    async function submitSyncSlideRange() {
      const startDate = document.getElementById("syncStartDate").value;
      const endDate = document.getElementById("syncEndDate").value;
      const resEl = document.getElementById("syncRangeResult");
      const btn = document.getElementById("syncRangeBtn");

      if (!startDate || !endDate) {
        showToast("請選擇完整的開始與結束日期！");
        return;
      }
      if (startDate > endDate) {
        showToast("開始日期不能晚於結束日期喔！");
        return;
      }

      btn.disabled = true;
      btn.textContent = "🔄 正在讀取簡報並寫入資料庫...";
      resEl.classList.add("hidden");

      try {
        const data = await callApi({
          action: "syncSlideRange",
          token: authToken,
          startDate: startDate,
          endDate: endDate
        });

        resEl.classList.remove("hidden");
        if (data.success) {
          resEl.className = "text-[11px] font-bold text-center p-2 rounded-lg bg-emerald-50 text-emerald-700";
          resEl.textContent = `✅ ${data.message}`;
          showToast(data.message);
          if (data.syncedDates && data.syncedDates.length > 0) {
            refreshTeacherPending();
          }
        } else {
          resEl.className = "text-[11px] font-bold text-center p-2 rounded-lg bg-rose-50 text-rose-700";
          resEl.textContent = `❌ ${data.message || "同步失敗"}`;
        }
      } catch (e) {
        resEl.classList.remove("hidden");
        resEl.className = "text-[11px] font-bold text-center p-2 rounded-lg bg-rose-50 text-rose-700";
        resEl.textContent = "❌ 連線異常，請稍後再試";
      } finally {
        btn.disabled = false;
        btn.textContent = "⚡ 立即強制讀取簡報";
      }
    }

    function setBadge(id, text, color) {
      const el = document.getElementById(id);
      const map = {
        blue: "bg-blue-100 text-blue-700",
        green: "bg-emerald-100 text-emerald-700",
        red: "bg-rose-100 text-rose-700"
      };
      el.textContent = text;
      el.className = `inline-block mt-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold ${map[color] || map.green}`;
    }

    // --- 🚀 啟動自動以安全 Token 登入 (不讀取任何密碼) ---
    window.onload = async function () {
      const savedToken = localStorage.getItem(TOKEN_STORAGE_KEY);
      if (!savedToken || GAS_API_URL.startsWith("請貼上")) return;

      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.textContent = "自動安全登入中...";
      try {
        const data = await callApi({ action: "verifySession", token: savedToken });
        if (data.success) {
          authToken = savedToken;
          enterAppByResponse(data);
        } else {
          localStorage.removeItem(TOKEN_STORAGE_KEY);
        }
      } catch (e) {
      } finally {
        btn.disabled = false;
        btn.textContent = "登入系統";
      }
    };
  </script>
</body>
</html>
